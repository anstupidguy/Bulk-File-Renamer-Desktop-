<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bulk File Renamer</title>
    
    <!-- Tailwind CSS for rapid styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- JSZip for client-side zip creation -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        app: {
                            bg: '#1e1e1e',
                            sidebar: '#252526',
                            toolbar: '#333333',
                            border: '#3c3c3c',
                            hover: '#2a2d2e',
                            primary: '#0e639c',
                            primaryHover: '#1177bb',
                            danger: '#f14c4c',
                            textMain: '#cccccc',
                            textMuted: '#858585'
                        }
                    },
                    fontFamily: {
                        sans: ['Segoe UI', 'San Francisco', 'Inter', 'Helvetica', 'Arial', 'sans-serif'],
                        mono: ['Consolas', 'Menlo', 'Monaco', 'Courier New', 'monospace']
                    }
                }
            }
        }
    </script>

    <style>
        /* Custom scrollbar for desktop app feel */
        ::-webkit-scrollbar {
            width: 10px;
            height: 10px;
        }
        ::-webkit-scrollbar-track {
            background: #1e1e1e;
        }
        ::-webkit-scrollbar-thumb {
            background: #424242;
            border: 1px solid #1e1e1e;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #4f4f4f;
        }
        ::-webkit-scrollbar-corner {
            background: #1e1e1e;
        }

        /* Drag over overlay */
        .drag-over-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(14, 99, 156, 0.2);
            border: 2px dashed #0e639c;
            z-index: 50;
            display: none;
            align-items: center;
            justify-content: center;
            pointer-events: none;
        }
        .drag-over .drag-over-overlay {
            display: flex;
        }

        /* Prevent text selection on UI elements */
        .no-select {
            user-select: none;
        }
    </style>
</head>
<body class="bg-app-bg text-app-textMain h-screen overflow-hidden flex flex-col font-sans" id="dropZone">
    
    <div class="drag-over-overlay flex-col text-app-primary">
        <svg class="w-16 h-16 mb-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 16a4 4 0 01-.88-7.903A5 5 0 1115.9 6L16 6a5 5 0 011 9.9M15 13l-3-3m0 0l-3 3m3-3v12"></path></svg>
        <h2 class="text-2xl font-semibold">Drop files or folders here</h2>
    </div>

    <!-- Toolbar -->
    <div class="h-12 bg-app-toolbar border-b border-app-border flex items-center px-4 justify-between shrink-0 no-select">
        <div class="flex items-center gap-2">
            <div class="font-semibold text-white mr-4 flex items-center gap-2">
                <svg class="w-5 h-5 text-app-primary" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 7v8a2 2 0 002 2h6M8 7V5a2 2 0 012-2h4.586a1 1 0 01.707.293l4.414 4.414a1 1 0 01.293.707V15a2 2 0 01-2 2h-2M8 7H6a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2v-2"></path></svg>
                Renamer Pro
            </div>
            
            <button onclick="document.getElementById('fileInput').click()" class="flex items-center gap-1.5 px-3 py-1.5 rounded bg-app-hover hover:bg-gray-600 transition-colors text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 13h6m-3-3v6m5 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path></svg>
                Add Files
            </button>
            <input type="file" id="fileInput" multiple class="hidden" onchange="App.handleFileSelect(event)">

            <button onclick="document.getElementById('folderInput').click()" class="flex items-center gap-1.5 px-3 py-1.5 rounded bg-app-hover hover:bg-gray-600 transition-colors text-sm">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-6l-2-2H5a2 2 0 00-2 2z"></path></svg>
                Add Folder
            </button>
            <input type="file" id="folderInput" webkitdirectory directory multiple class="hidden" onchange="App.handleFileSelect(event)">

            <button onclick="App.clearAll()" class="flex items-center gap-1.5 px-3 py-1.5 rounded bg-app-hover hover:bg-gray-600 transition-colors text-sm ml-2">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                Clear
            </button>
        </div>

        <button onclick="App.exportZip()" id="btnExport" class="flex items-center gap-1.5 px-4 py-1.5 rounded bg-app-primary hover:bg-app-primaryHover transition-colors text-sm text-white font-medium disabled:opacity-50 disabled:cursor-not-allowed">
            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
            <span id="exportText">Export ZIP</span>
        </button>
    </div>

    <div class="flex flex-1 overflow-hidden">
        
        <!-- Left Sidebar: Rules Engine -->
        <div class="w-80 bg-app-sidebar border-r border-app-border flex flex-col shrink-0">
            <div class="p-4 border-b border-app-border no-select">
                <h3 class="text-sm font-semibold uppercase tracking-wider text-app-textMuted mb-3">Renaming Rules</h3>
                
                <div class="flex gap-2">
                    <select id="ruleTypeSelect" class="flex-1 bg-app-bg border border-app-border rounded px-2 py-1.5 text-sm outline-none focus:border-app-primary">
                        <option value="prefixSuffix">Add Prefix / Suffix</option>
                        <option value="findReplace">Find and Replace</option>
                        <option value="pattern">Custom Pattern</option>
                        <option value="case">Change Case</option>
                    </select>
                    <button onclick="App.addRule()" class="bg-app-hover hover:bg-gray-600 border border-app-border rounded px-3 py-1.5 text-sm transition-colors">
                        Add
                    </button>
                </div>
            </div>

            <!-- Active Rules Container -->
            <div id="rulesContainer" class="flex-1 overflow-y-auto p-4 space-y-3">
                <!-- Rules will be injected here dynamically -->
                <div class="text-center text-app-textMuted text-sm mt-10" id="noRulesMsg">
                    No active rules.<br>Select a rule above and click "Add".
                </div>
            </div>
        </div>

        <!-- Main Content: Data Table -->
        <div class="flex-1 flex flex-col bg-app-bg relative">
            
            <div class="flex-1 overflow-auto">
                <table class="w-full text-left border-collapse whitespace-nowrap text-sm">
                    <thead class="sticky top-0 bg-app-toolbar border-b border-app-border shadow-sm z-10 no-select">
                        <tr>
                            <th class="px-4 py-2 font-medium text-app-textMuted w-10 text-center">#</th>
                            <th class="px-4 py-2 font-medium text-app-textMuted">Original Name</th>
                            <th class="px-4 py-2 font-medium text-app-textMuted text-white">New Name</th>
                            <th class="px-4 py-2 font-medium text-app-textMuted">Status</th>
                            <th class="px-4 py-2 font-medium text-app-textMuted">Path</th>
                            <th class="px-4 py-2 font-medium text-app-textMuted text-right">Size</th>
                        </tr>
                    </thead>
                    <tbody id="fileTableBody" class="divide-y divide-app-border/50">
                        <!-- File rows will be injected here -->
                        <tr id="noFilesMsg">
                            <td colspan="6" class="px-4 py-20 text-center text-app-textMuted">
                                <div class="flex flex-col items-center justify-center">
                                    <svg class="w-12 h-12 mb-3 text-gray-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
                                    <p class="text-base">No files loaded.</p>
                                    <p class="text-sm mt-1">Use the toolbar or drag & drop files here.</p>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Status Bar -->
            <div class="h-6 bg-app-primary border-t border-app-border flex items-center px-4 justify-between text-xs text-white shrink-0 no-select">
                <div id="statusCount">0 files loaded</div>
                <div id="statusConflicts" class="text-red-200 hidden">0 conflicts detected</div>
            </div>
        </div>
    </div>

    <script>
        const App = {
            files: [], // Array of { id, rawFile, originalName, extension, dirPath, size, newName, isConflict }
            rules: [], // Array of rule objects
            ruleCounter: 0,
            hasConflicts: false,

            // Initialize app and event listeners
            init() {
                this.setupDragAndDrop();
                this.updateUI();
            },

            setupDragAndDrop() {
                const dropZone = document.getElementById('dropZone');
                
                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                    dropZone.addEventListener(eventName, preventDefaults, false);
                });

                function preventDefaults(e) {
                    e.preventDefault();
                    e.stopPropagation();
                }

                ['dragenter', 'dragover'].forEach(eventName => {
                    dropZone.addEventListener(eventName, () => dropZone.classList.add('drag-over'), false);
                });

                ['dragleave', 'drop'].forEach(eventName => {
                    dropZone.addEventListener(eventName, () => dropZone.classList.remove('drag-over'), false);
                });

                dropZone.addEventListener('drop', (e) => {
                    const dt = e.dataTransfer;
                    this.processFiles(dt.files);
                }, false);
            },

            handleFileSelect(event) {
                this.processFiles(event.target.files);
                event.target.value = ''; // Reset input
            },

            processFiles(fileList) {
                if (!fileList || fileList.length === 0) return;

                const newFiles = Array.from(fileList).map(file => {
                    // Extract path, name, extension
                    const fullPath = file.webkitRelativePath || file.name;
                    const pathParts = fullPath.split('/');
                    const filename = pathParts.pop();
                    const dirPath = pathParts.length > 0 ? pathParts.join('/') + '/' : '';
                    
                    const lastDotIndex = filename.lastIndexOf('.');
                    let originalName, extension;
                    
                    if (lastDotIndex === -1 || lastDotIndex === 0) {
                        originalName = filename;
                        extension = '';
                    } else {
                        originalName = filename.substring(0, lastDotIndex);
                        extension = filename.substring(lastDotIndex); // includes the dot
                    }

                    return {
                        id: Math.random().toString(36).substring(2, 9),
                        rawFile: file,
                        originalName: originalName,
                        extension: extension,
                        dirPath: dirPath,
                        size: this.formatBytes(file.size),
                        newName: originalName, // Will be updated by rules
                        isConflict: false
                    };
                });

                this.files = [...this.files, ...newFiles];
                // Limit check (warning only)
                if (this.files.length > 2000) {
                    alert("Warning: Processing a very large number of files may slow down the browser.");
                }
                
                this.applyRules();
            },

            clearAll() {
                this.files = [];
                this.applyRules();
            },

            formatBytes(bytes, decimals = 2) {
                if (bytes === 0) return '0 Bytes';
                const k = 1024;
                const dm = decimals < 0 ? 0 : decimals;
                const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
                const i = Math.floor(Math.log(bytes) / Math.log(k));
                return parseFloat((bytes / Math.pow(k, i)).toFixed(dm)) + ' ' + sizes[i];
            },

            addRule() {
                const type = document.getElementById('ruleTypeSelect').value;
                this.ruleCounter++;
                let rule = { id: this.ruleCounter, type: type };

                switch (type) {
                    case 'prefixSuffix':
                        rule.prefix = ''; rule.suffix = ''; break;
                    case 'findReplace':
                        rule.find = ''; rule.replace = ''; rule.isRegex = false; break;
                    case 'pattern':
                        rule.pattern = '[YYYY]-[MM]-[DD]_Project_[NNN]'; rule.startNum = 1; rule.padding = 3; break;
                    case 'case':
                        rule.caseMode = 'lowercase'; break;
                }

                this.rules.push(rule);
                this.renderRules();
                this.applyRules();
            },

            removeRule(id) {
                this.rules = this.rules.filter(r => r.id !== id);
                this.renderRules();
                this.applyRules();
            },

            moveRule(id, direction) {
                const index = this.rules.findIndex(r => r.id === id);
                if (index < 0) return;
                
                if (direction === 'up' && index > 0) {
                    const temp = this.rules[index];
                    this.rules[index] = this.rules[index - 1];
                    this.rules[index - 1] = temp;
                } else if (direction === 'down' && index < this.rules.length - 1) {
                    const temp = this.rules[index];
                    this.rules[index] = this.rules[index + 1];
                    this.rules[index + 1] = temp;
                }
                this.renderRules();
                this.applyRules();
            },

            updateRule(id, key, value) {
                const rule = this.rules.find(r => r.id === id);
                if (rule) {
                    if (key === 'isRegex') value = value === 'true'; // string boolean to real boolean
                    rule[key] = value;
                    this.applyRules();
                }
            },

            applyRules() {
                const today = new Date();
                const YYYY = today.getFullYear().toString();
                const MM = (today.getMonth() + 1).toString().padStart(2, '0');
                const DD = today.getDate().toString().padStart(2, '0');

                // Track pattern numbering globally across the current rule application pass
                let patternCounter = 0;

                // Process each file
                this.files.forEach(file => {
                    let currentName = file.originalName;

                    this.rules.forEach(rule => {
                        try {
                            if (rule.type === 'prefixSuffix') {
                                currentName = (rule.prefix || '') + currentName + (rule.suffix || '');
                            } 
                            else if (rule.type === 'findReplace') {
                                if (rule.find) {
                                    if (rule.isRegex) {
                                        const regex = new RegExp(rule.find, 'g');
                                        currentName = currentName.replace(regex, rule.replace || '');
                                    } else {
                                        currentName = currentName.split(rule.find).join(rule.replace || '');
                                    }
                                }
                            }
                            else if (rule.type === 'case') {
                                if (rule.caseMode === 'lowercase') currentName = currentName.toLowerCase();
                                else if (rule.caseMode === 'uppercase') currentName = currentName.toUpperCase();
                                else if (rule.caseMode === 'titlecase') {
                                    currentName = currentName.replace(/\w\S*/g, txt => txt.charAt(0).toUpperCase() + txt.substr(1).toLowerCase());
                                }
                            }
                            else if (rule.type === 'pattern') {
                                let newStr = rule.pattern || '';
                                newStr = newStr.replace(/\[YYYY\]/g, YYYY);
                                newStr = newStr.replace(/\[MM\]/g, MM);
                                newStr = newStr.replace(/\[DD\]/g, DD);
                                
                                // Numbering logic
                                if (newStr.includes('[NNN]')) {
                                    const numStr = (parseInt(rule.startNum) + patternCounter).toString().padStart(parseInt(rule.padding), '0');
                                    newStr = newStr.replace(/\[NNN\]/g, numStr);
                                }
                                
                                // Insert original name token if they want to keep part of it inside the pattern
                                newStr = newStr.replace(/\[ORIGINAL\]/g, currentName);
                                
                                currentName = newStr;
                            }
                        } catch (e) {
                            console.error("Rule error:", e);
                            // Keep currentName intact if regex fails
                        }
                    });

                    file.newName = currentName;
                    
                    // Only increment counter if pattern rule exists
                    if (this.rules.some(r => r.type === 'pattern')) {
                        patternCounter++;
                    }
                });

                this.detectConflicts();
            },

            detectConflicts() {
                const pathNameMap = {};
                this.hasConflicts = false;

                // Pass 1: Count occurrences
                this.files.forEach(file => {
                    const fullNewPath = file.dirPath + file.newName + file.extension;
                    pathNameMap[fullNewPath] = (pathNameMap[fullNewPath] || 0) + 1;
                });

                let conflictCount = 0;

                // Pass 2: Flag conflicts
                this.files.forEach(file => {
                    const fullNewPath = file.dirPath + file.newName + file.extension;
                    if (pathNameMap[fullNewPath] > 1) {
                        file.isConflict = true;
                        this.hasConflicts = true;
                        conflictCount++;
                    } else {
                        file.isConflict = false;
                    }
                });

                this.updateUI(conflictCount);
            },

            renderRules() {
                const container = document.getElementById('rulesContainer');
                const noMsg = document.getElementById('noRulesMsg');
                
                if (this.rules.length === 0) {
                    noMsg.style.display = 'block';
                    // Clear existing rules nodes (leave noMsg)
                    Array.from(container.children).forEach(child => {
                        if (child.id !== 'noRulesMsg') child.remove();
                    });
                    return;
                } else {
                    noMsg.style.display = 'none';
                }

                // Rebuild rules UI
                let html = '';
                this.rules.forEach((rule, index) => {
                    const isFirst = index === 0;
                    const isLast = index === this.rules.length - 1;
                    
                    let innerContent = '';
                    let title = '';

                    if (rule.type === 'prefixSuffix') {
                        title = 'Prefix / Suffix';
                        innerContent = `
                            <div class="grid grid-cols-2 gap-2 mt-2">
                                <div>
                                    <label class="text-[11px] text-app-textMuted uppercase">Prefix</label>
                                    <input type="text" value="${this.escapeHtml(rule.prefix)}" oninput="App.updateRule(${rule.id}, 'prefix', this.value)" class="w-full bg-app-bg border border-app-border rounded px-2 py-1 text-sm outline-none focus:border-app-primary">
                                </div>
                                <div>
                                    <label class="text-[11px] text-app-textMuted uppercase">Suffix</label>
                                    <input type="text" value="${this.escapeHtml(rule.suffix)}" oninput="App.updateRule(${rule.id}, 'suffix', this.value)" class="w-full bg-app-bg border border-app-border rounded px-2 py-1 text-sm outline-none focus:border-app-primary">
                                </div>
                            </div>
                        `;
                    } else if (rule.type === 'findReplace') {
                        title = 'Find & Replace';
                        innerContent = `
                            <div class="space-y-2 mt-2">
                                <div>
                                    <label class="text-[11px] text-app-textMuted uppercase">Find</label>
                                    <input type="text" value="${this.escapeHtml(rule.find)}" oninput="App.updateRule(${rule.id}, 'find', this.value)" class="w-full bg-app-bg border border-app-border rounded px-2 py-1 text-sm outline-none focus:border-app-primary">
                                </div>
                                <div>
                                    <label class="text-[11px] text-app-textMuted uppercase">Replace</label>
                                    <input type="text" value="${this.escapeHtml(rule.replace)}" oninput="App.updateRule(${rule.id}, 'replace', this.value)" class="w-full bg-app-bg border border-app-border rounded px-2 py-1 text-sm outline-none focus:border-app-primary">
                                </div>
                                <div class="flex items-center gap-2 pt-1">
                                    <input type="checkbox" id="regex_${rule.id}" ${rule.isRegex ? 'checked' : ''} onchange="App.updateRule(${rule.id}, 'isRegex', this.checked ? 'true' : 'false')" class="accent-app-primary">
                                    <label for="regex_${rule.id}" class="text-xs text-app-textMuted cursor-pointer">Use Regular Expressions</label>
                                </div>
                            </div>
                        `;
                    } else if (rule.type === 'pattern') {
                        title = 'Custom Pattern';
                        innerContent = `
                            <div class="space-y-2 mt-2">
                                <div>
                                    <label class="text-[11px] text-app-textMuted uppercase flex justify-between">
                                        <span>Pattern</span>
                                        <span class="text-app-primary" title="Available tokens: [YYYY], [MM], [DD], [NNN], [ORIGINAL]">Tokens?</span>
                                    </label>
                                    <input type="text" value="${this.escapeHtml(rule.pattern)}" oninput="App.updateRule(${rule.id}, 'pattern', this.value)" class="w-full bg-app-bg border border-app-border rounded px-2 py-1 text-sm outline-none focus:border-app-primary font-mono text-xs">
                                </div>
                                <div class="grid grid-cols-2 gap-2">
                                    <div>
                                        <label class="text-[11px] text-app-textMuted uppercase">Start #</label>
                                        <input type="number" min="0" value="${rule.startNum}" oninput="App.updateRule(${rule.id}, 'startNum', this.value)" class="w-full bg-app-bg border border-app-border rounded px-2 py-1 text-sm outline-none focus:border-app-primary">
                                    </div>
                                    <div>
                                        <label class="text-[11px] text-app-textMuted uppercase">Padding</label>
                                        <input type="number" min="1" max="10" value="${rule.padding}" oninput="App.updateRule(${rule.id}, 'padding', this.value)" class="w-full bg-app-bg border border-app-border rounded px-2 py-1 text-sm outline-none focus:border-app-primary">
                                    </div>
                                </div>
                            </div>
                        `;
                    } else if (rule.type === 'case') {
                        title = 'Change Case';
                        innerContent = `
                            <div class="mt-2">
                                <label class="text-[11px] text-app-textMuted uppercase">Format</label>
                                <select onchange="App.updateRule(${rule.id}, 'caseMode', this.value)" class="w-full bg-app-bg border border-app-border rounded px-2 py-1.5 text-sm outline-none focus:border-app-primary mt-1">
                                    <option value="lowercase" ${rule.caseMode === 'lowercase' ? 'selected' : ''}>lowercase</option>
                                    <option value="uppercase" ${rule.caseMode === 'uppercase' ? 'selected' : ''}>UPPERCASE</option>
                                    <option value="titlecase" ${rule.caseMode === 'titlecase' ? 'selected' : ''}>Title Case</option>
                                </select>
                            </div>
                        `;
                    }

                    html += `
                        <div class="bg-app-bg border border-app-border rounded shadow-sm p-3 relative group">
                            <div class="flex justify-between items-center mb-1">
                                <h4 class="text-xs font-semibold text-gray-300 flex items-center gap-2">
                                    <span class="bg-gray-700 text-white rounded-full w-4 h-4 flex items-center justify-center text-[10px]">${index + 1}</span>
                                    ${title}
                                </h4>
                                <div class="flex items-center gap-1 opacity-0 group-hover:opacity-100 transition-opacity">
                                    <button onclick="App.moveRule(${rule.id}, 'up')" class="${isFirst ? 'text-gray-600 cursor-not-allowed' : 'text-gray-400 hover:text-white'}" ${isFirst ? 'disabled' : ''}>
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 15l7-7 7 7"></path></svg>
                                    </button>
                                    <button onclick="App.moveRule(${rule.id}, 'down')" class="${isLast ? 'text-gray-600 cursor-not-allowed' : 'text-gray-400 hover:text-white'}" ${isLast ? 'disabled' : ''}>
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path></svg>
                                    </button>
                                    <button onclick="App.removeRule(${rule.id})" class="text-app-danger hover:text-red-400 ml-1">
                                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                    </button>
                                </div>
                            </div>
                            ${innerContent}
                        </div>
                    `;
                });

                // Inject preserving the empty message div (hidden)
                Array.from(container.children).forEach(child => {
                    if (child.id !== 'noRulesMsg') child.remove();
                });
                container.insertAdjacentHTML('beforeend', html);
            },

            updateUI(conflictCount = 0) {
                const tbody = document.getElementById('fileTableBody');
                const noMsg = document.getElementById('noFilesMsg');
                const statusCount = document.getElementById('statusCount');
                const statusConflicts = document.getElementById('statusConflicts');
                const btnExport = document.getElementById('btnExport');
                
                statusCount.textContent = `${this.files.length} file${this.files.length === 1 ? '' : 's'} loaded`;
                
                if (conflictCount > 0) {
                    statusConflicts.textContent = `${conflictCount} conflict${conflictCount === 1 ? '' : 's'} detected!`;
                    statusConflicts.classList.remove('hidden');
                    statusCount.parentNode.classList.remove('bg-app-primary');
                    statusCount.parentNode.classList.add('bg-app-danger');
                } else {
                    statusConflicts.classList.add('hidden');
                    statusCount.parentNode.classList.add('bg-app-primary');
                    statusCount.parentNode.classList.remove('bg-app-danger');
                }

                btnExport.disabled = this.files.length === 0;

                if (this.files.length === 0) {
                    tbody.innerHTML = '';
                    tbody.appendChild(noMsg);
                    return;
                }

                // Render table rows (Using fragment for performance on 500+ items)
                const fragment = document.createDocumentFragment();
                
                this.files.forEach((file, index) => {
                    const tr = document.createElement('tr');
                    tr.className = `hover:bg-app-hover border-b border-app-border/30 transition-colors ${file.isConflict ? 'bg-red-900/20' : ''}`;
                    
                    const newNameDisplay = `<span class="font-medium ${file.isConflict ? 'text-red-400' : 'text-green-400'}">${this.escapeHtml(file.newName)}</span><span class="text-gray-500">${this.escapeHtml(file.extension)}</span>`;
                    
                    const statusIcon = file.isConflict 
                        ? `<span class="inline-flex items-center gap-1 text-xs text-red-400"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg> Conflict</span>`
                        : `<span class="inline-flex items-center gap-1 text-xs text-green-500"><svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7"></path></svg> Ready</span>`;

                    tr.innerHTML = `
                        <td class="px-4 py-2 text-center text-xs text-app-textMuted">${index + 1}</td>
                        <td class="px-4 py-2 truncate max-w-[200px]" title="${this.escapeHtml(file.originalName + file.extension)}">
                            ${this.escapeHtml(file.originalName)}<span class="text-gray-500">${this.escapeHtml(file.extension)}</span>
                        </td>
                        <td class="px-4 py-2 truncate max-w-[250px]" title="${this.escapeHtml(file.newName + file.extension)}">
                            ${newNameDisplay}
                        </td>
                        <td class="px-4 py-2">${statusIcon}</td>
                        <td class="px-4 py-2 text-app-textMuted text-xs truncate max-w-[150px]" title="${this.escapeHtml(file.dirPath)}">${this.escapeHtml(file.dirPath) || '/'}</td>
                        <td class="px-4 py-2 text-right text-xs text-app-textMuted">${file.size}</td>
                    `;
                    fragment.appendChild(tr);
                });

                tbody.innerHTML = '';
                tbody.appendChild(fragment);
            },

            async exportZip() {
                if (this.files.length === 0) return;
                
                if (this.hasConflicts) {
                    alert("Please resolve naming conflicts (highlighted in red) before exporting. Two files cannot have the same name in the same directory.");
                    return;
                }

                const btn = document.getElementById('btnExport');
                const text = document.getElementById('exportText');
                
                btn.disabled = true;
                text.textContent = "Zipping...";
                btn.classList.add('animate-pulse');

                try {
                    const zip = new JSZip();
                    
                    // Add files to zip
                    this.files.forEach(file => {
                        const fullPath = file.dirPath + file.newName + file.extension;
                        zip.file(fullPath, file.rawFile);
                    });

                    // Generate blob
                    const content = await zip.generateAsync({ 
                        type: "blob",
                        compression: "DEFLATE",
                        compressionOptions: { level: 1 } // Fast compression
                    }, (metadata) => {
                        text.textContent = `Zipping... ${Math.round(metadata.percent)}%`;
                    });

                    // Trigger Download
                    const link = document.createElement('a');
                    link.href = URL.createObjectURL(content);
                    link.download = `Renamed_Files_${new Date().getTime()}.zip`;
                    document.body.appendChild(link);
                    link.click();
                    document.body.removeChild(link);
                    
                    // Cleanup
                    setTimeout(() => URL.revokeObjectURL(link.href), 1000);

                } catch (error) {
                    console.error("Zip generation error", error);
                    alert("An error occurred while generating the ZIP file.");
                } finally {
                    btn.disabled = false;
                    text.textContent = "Export ZIP";
                    btn.classList.remove('animate-pulse');
                }
            },

            // Helper to prevent XSS in table rendering
            escapeHtml(unsafe) {
                if (!unsafe) return '';
                return unsafe
                     .replace(/&/g, "&amp;")
                     .replace(/</g, "&lt;")
                     .replace(/>/g, "&gt;")
                     .replace(/"/g, "&quot;")
                     .replace(/'/g, "&#039;");
            }
        };

        // Initialize on load
        window.addEventListener('DOMContentLoaded', () => {
            App.init();
        });
    </script>
</body>
</html>
